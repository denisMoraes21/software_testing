<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de Pessoa Física</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="card">

    <h1>Cadastro de Pessoa Física</h1>

    <p class="subtitle">
        Preencha os dados para realizar o cadastro
    </p>

    <div class="section">

        <h2>Dados Pessoais</h2>

        <input
            type="text"
            id="nome_completo"
            placeholder="Nome completo"
        >

        <div class="row">

            <input
                type="text"
                id="cpf"
                placeholder="CPF"
            >

            <input
                type="date"
                id="data_nascimento"
            >

        </div>

        <div class="row">

            <select id="sexo">

                <option value="">
                    Sexo
                </option>

                <option value="Masculino">
                    Masculino
                </option>

                <option value="Feminino">
                    Feminino
                </option>

                <option value="Outro">
                    Outro
                </option>

            </select>

            <select id="estado_civil">

                <option value="">
                    Estado Civil
                </option>

                <option value="Solteiro">
                    Solteiro
                </option>

                <option value="Casado">
                    Casado
                </option>

                <option value="Divorciado">
                    Divorciado
                </option>

                <option value="Viúvo">
                    Viúvo
                </option>

            </select>

        </div>

        <input
            type="text"
            id="nacionalidade"
            placeholder="Nacionalidade"
        >

        <h2>Contato</h2>

        <div class="row">

            <input
                type="text"
                id="telefone"
                placeholder="Telefone"
            >

            <input
                type="text"
                id="celular"
                placeholder="Celular"
            >

        </div>

        <input
            type="email"
            id="email"
            placeholder="E-mail"
        >

        <h2>Endereço</h2>

        <div class="row">

            <input
                type="text"
                id="cep"
                placeholder="CEP"
            >

            <input
                type="text"
                id="logradouro"
                placeholder="Logradouro"
            >

        </div>

        <div class="row">

            <input
                type="text"
                id="numero"
                placeholder="Número"
            >

            <input
                type="text"
                id="complemento"
                placeholder="Complemento"
            >

        </div>

        <div class="row">

            <input
                type="text"
                id="bairro"
                placeholder="Bairro"
            >

            <input
                type="text"
                id="cidade"
                placeholder="Cidade"
            >

            <input
                type="text"
                id="estado"
                placeholder="UF"
                maxlength="2"
            >

        </div>

        <button
            id="button-create"
            onclick="createPessoa()"
        >
            Cadastrar Pessoa
        </button>

    </div>

</div>

<script
    src="{{ url_for('static', filename='js/pessoas.js') }}"
></script>

</body>

</html>
